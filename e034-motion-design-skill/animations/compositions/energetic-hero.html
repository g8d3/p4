<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Energetic — Hero Slam</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0A0C12;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0A0C12;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #bg {
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }
      #blob-a {
        width: 760px;
        height: 760px;
        left: -260px;
        top: -240px;
        background: radial-gradient(circle at 40% 40%, rgba(255, 45, 174, 0.55), rgba(255, 45, 174, 0) 70%);
      }
      #blob-b {
        width: 720px;
        height: 720px;
        right: -240px;
        bottom: -260px;
        background: radial-gradient(circle at 40% 40%, rgba(34, 227, 255, 0.45), rgba(34, 227, 255, 0) 70%);
      }
      .streak {
        position: absolute;
        height: 6px;
        border-radius: 999px;
        transform-origin: center center;
      }
      #st-1 { width: 520px; top: 150px; left: -560px; background: linear-gradient(90deg, rgba(34,227,255,0), rgba(34,227,255,0.9)); }
      #st-2 { width: 640px; top: 300px; left: -680px; background: linear-gradient(90deg, rgba(255,45,174,0), rgba(255,45,174,0.9)); }
      #st-3 { width: 480px; top: 760px; left: -520px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.75)); }
      #st-4 { width: 700px; top: 880px; left: -740px; background: linear-gradient(90deg, rgba(34,227,255,0), rgba(34,227,255,0.8)); }
      #st-5 { width: 560px; top: 420px; right: -600px; background: linear-gradient(90deg, rgba(255,45,174,0.9), rgba(255,45,174,0)); }
      #st-6 { width: 460px; top: 640px; right: -500px; background: linear-gradient(90deg, rgba(34,227,255,0.8), rgba(34,227,255,0)); }
      /* hero */
      #stage {
        display: grid;
        place-items: center;
      }
      .hero {
        position: relative;
        text-align: center;
      }
      #ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 460px;
        height: 460px;
        margin: -230px 0 0 -230px;
        border: 3px solid rgba(34, 227, 255, 0.65);
        border-radius: 50%;
      }
      #ring-inner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 560px;
        height: 560px;
        margin: -280px 0 0 -280px;
        border: 2px solid rgba(255, 45, 174, 0.5);
        border-radius: 50%;
      }
      h1 {
        position: relative;
        font-size: 210px;
        font-weight: 900;
        letter-spacing: -6px;
        line-height: 1;
        color: #FFFFFF;
        display: flex;
      }
      h1 .c1 { color: #22E3FF; }
      h1 .c2 { color: #FF2FD6; }
      #underline {
        height: 14px;
        margin: 34px auto 0;
        width: 620px;
        border-radius: 999px;
        background: linear-gradient(90deg, #22E3FF, #FF2FD6);
        transform-origin: left center;
      }
      #subline {
        margin-top: 34px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 8px;
        text-transform: uppercase;
        color: #B7BFCC;
      }
      #badge {
        position: absolute;
        right: 90px;
        bottom: 80px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: linear-gradient(135deg, #FF2FD6, #22E3FF);
        display: grid;
        place-items: center;
        font-size: 44px;
        font-weight: 900;
        color: #0A0C12;
      }
      #spark {
        position: absolute;
        left: 210px;
        bottom: 200px;
        font-size: 74px;
        color: #FFD75E;
        text-shadow: 0 0 30px rgba(255, 215, 94, 0.8);
      }
      .tag {
        position: absolute;
        top: 42px;
        left: 48px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #B4BDD0;
      }
      .spec {
        position: absolute;
        bottom: 40px;
        left: 48px;
        font-size: 16px;
        letter-spacing: 2px;
        color: #B4BDD0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="energetic"
      data-start="0"
      data-duration="5.5"
      data-width="1920"
      data-height="1080"
    >
      <section id="bg" class="clip" data-start="0" data-duration="5.5" data-track-index="1">
        <div id="blob-a" class="blob"></div>
        <div id="blob-b" class="blob"></div>
        <div id="st-1" class="streak" data-layout-allow-overflow></div>
        <div id="st-2" class="streak" data-layout-allow-overflow></div>
        <div id="st-3" class="streak" data-layout-allow-overflow></div>
        <div id="st-4" class="streak" data-layout-allow-overflow></div>
        <div id="st-5" class="streak" data-layout-allow-overflow></div>
        <div id="st-6" class="streak" data-layout-allow-overflow></div>
      </section>

      <section id="stage" class="clip" data-start="0" data-duration="5.5" data-track-index="2">
        <div class="hero">
          <div id="ring"></div>
          <div id="ring-inner"></div>
          <h1>
            <span class="c1">I</span><span>G</span><span>N</span><span class="c2">I</span><span>T</span><span>E</span>
          </h1>
          <div id="underline"></div>
          <div id="subline">Fast · Bold · Expo out</div>
        </div>
        <div id="badge">GO</div>
        <div id="spark">★</div>
        <div class="tag">motion-design skill · 04</div>
        <div class="spec">personality: energetic</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ambient blobs drift fast */
      tl.fromTo("#blob-a", { x: 0, y: 0, scale: 1 }, { x: 60, y: -50, scale: 1.12, duration: 2.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0);
      tl.fromTo("#blob-b", { x: 0, y: 0, scale: 1 }, { x: -55, y: 45, scale: 1.1, duration: 2.9, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.2);

      /* speed lines whip across (counter-motion to the hero) */
      tl.fromTo(".streak", { x: 0 }, { x: -1900, duration: 0.9, ease: "expo.in" }, 0.25);
      tl.fromTo("#st-5", { x: 0 }, { x: 1900, duration: 0.9, ease: "expo.in" }, 0.4);
      tl.fromTo("#st-6", { x: 0 }, { x: 1900, duration: 0.9, ease: "expo.in" }, 0.2);

      /* headline slams in — per letter, explosive, slight overshoot */
      tl.from("h1 span", {
        y: 70,
        scale: 2.2,
        rotation: -9,
        autoAlpha: 0,
        duration: 0.55,
        stagger: 0.045,
        ease: "expo.out",
      }, 0.75);

      /* rings pulse out around the word */
      tl.fromTo("#ring", { scale: 0.4, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0.9);
      tl.fromTo("#ring-inner", { scale: 0.7, autoAlpha: 0 }, { scale: 1.35, autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 0.9);

      /* underline slashes in + subline */
      tl.fromTo("#underline", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 1.1);
      tl.from("#subline", { y: 18, autoAlpha: 0, duration: 0.3, ease: "power2.out" }, 1.25);

      /* badge + spark burst in with a snap */
      tl.fromTo("#badge", { scale: 0, rotation: -24, autoAlpha: 0 }, { scale: 1, rotation: 0, autoAlpha: 1, duration: 0.4, ease: "back.out(1.9)" }, 1.55);
      tl.fromTo("#spark", { scale: 0, autoAlpha: 0 }, { scale: 1.25, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)" }, 1.7);

      tl.from(".tag", { y: -12, autoAlpha: 0, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.from(".spec", { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 2.4);

      window.__timelines["energetic"] = tl;
    </script>
  </body>
</html>
