<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R3 web-three — talking duo (6s @24fps L1)</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14161c; color: #eee; font: 15px/1.45 system-ui, sans-serif; }
  #wrap { position: relative; max-width: 1280px; margin: 0 auto; }
  #c { width: 100%; height: 72vh; min-height: 360px; display: block; touch-action: none; background: #1b1e26; }
  #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  #speakerA, #speakerB { padding: 2px 10px; border-radius: 999px; font-weight: bold; opacity: .35; }
  #speakerA.live { background: #e0393e; opacity: 1; }
  #speakerB.live { background: #2f6fed; opacity: 1; }
  .bar { display: flex; gap: 8px; padding: 10px 12px; align-items: center; max-width: 1280px; margin: 0 auto; flex-wrap: wrap; }
  button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid #444; background: #22262f; color: #eee; cursor: pointer; }
  button.on { background: #2f6fed; border-color: #2f6fed; }
  #scrub { flex: 1; min-width: 160px; }
  #meta { color: #8a93a6; font-size: 13px; padding: 0 12px 16px; max-width: 1280px; margin: 0 auto; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/controls/OrbitControls.js": "../vendor/OrbitControls.js"
} }
</script>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="hud"><span id="speakerA">A ● TALKING</span><span id="frame">f001 / 144</span><span id="speakerB">B ● TALKING</span></div>
</div>
<div class="bar">
  <button id="play" class="on">⏸ pause</button>
  <input id="scrub" type="range" min="0" max="143" step="1" value="0">
  <button id="cam">camera: front</button>
</div>
<div id="meta">R3 web-three · talking duo L1 (jaw + head bob + hands + blink) · A talks f1–72, B talks f73–144 · 6s @24fps loop · drag to orbit, wheel to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const FPS = 24, FRAMES = 144, DUR = 6;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(1280, 720, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1e26);
scene.fog = new THREE.Fog(0x1b1e26, 12, 26);

const camera = new THREE.PerspectiveCamera(40, 1280/720, 0.1, 100);
const CAMS = { front: [[0, 2.1, 6.4], [0, 1.35, 0]], side: [[6.4, 2.1, 0.6], [0, 1.3, 0]], top: [[0, 7.5, 1.6], [0, 0.8, 0]] };
let camName = 'front';
function setCam(n){ camName = n; camera.position.set(...CAMS[n][0]);
  controls.target.set(...CAMS[n][1]); controls.update();
  document.getElementById('cam').textContent = 'camera: ' + n; }

// lights: 1 SUN + 1 AREA-ish fill (frozen per brief)
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(4, 7, 5); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -4;
scene.add(sun);
const fill = new THREE.RectAreaLight ? null : null;
const area = new THREE.DirectionalLight(0xbcd0ff, 0.7); // fill stand-in (RectAreaLight needs helper init; directional keeps it cheap)
area.position.set(-5, 3, 4); scene.add(area);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2620, 0.55));

// ground plane
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 48),
  new THREE.MeshStandardMaterial({ color: 0x2a2e38, roughness: 0.95 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(2.2, 2.28, 64),
  new THREE.MeshBasicMaterial({ color: 0x3a4050, side: THREE.DoubleSide }));
ring.rotation.x = -Math.PI/2; ring.position.y = 0.01; scene.add(ring);

function mat(c){ return new THREE.MeshStandardMaterial({ color: c, roughness: 0.6 }); }
const skinMat = mat(0xf2c89b), darkMat = mat(0x22242a), whiteMat = mat(0xffffff);

function makeChar(color, x, faceDir){
  const g = new THREE.Group(); g.position.x = x;
  const bodyMat = mat(color);
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.75, 6, 16), bodyMat);
  body.position.y = 1.02; body.castShadow = true; g.add(body);
  // legs (two short capsules)
  for (const s of [-1, 1]){
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.3, 4, 10), darkMat);
    leg.position.set(s*0.15, 0.28, 0); leg.castShadow = true; g.add(leg);
  }
  // head group (pivot at neck for bob)
  const neck = new THREE.Group(); neck.position.y = 1.72; g.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.30, 24, 18), bodyMat);
  head.position.y = 0.26; head.castShadow = true; neck.add(head);
  // eyes (blink via scale.y)
  const eyes = [];
  for (const s of [-1, 1]){
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), whiteMat);
    e.position.set(s*0.11, 0.32, 0.25); neck.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), darkMat);
    p.position.set(s*0.11, 0.32, 0.30); neck.add(p); eyes.push(e, p);
  }
  // jaw: pivot group at chin hinge, flap = rotation.x
  const jawPivot = new THREE.Group(); jawPivot.position.set(0, 0.12, 0.10); neck.add(jawPivot);
  const jaw = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), skinMat);
  jaw.scale.set(1.15, 0.62, 1.0); jaw.position.set(0, -0.06, 0.12);
  jaw.castShadow = true; jawPivot.add(jaw);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.03, 0.02),
    new THREE.MeshBasicMaterial({ color: 0x5a1a1a }));
  mouth.position.set(0, 0.0, 0.24); jawPivot.add(mouth);
  // arms: shoulder pivots, capsule hanging down; gesture = shoulder rotation
  const arms = {};
  for (const s of [-1, 1]){
    const sh = new THREE.Group(); sh.position.set(s*0.44, 1.52, 0); g.add(sh);
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.10, 0.5, 4, 10), bodyMat);
    arm.position.y = -0.33; arm.castShadow = true; sh.add(arm);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), skinMat);
    hand.position.y = -0.66; hand.castShadow = true; sh.add(hand);
    sh.rotation.z = s * 0.18; arms[s < 0 ? 'L' : 'R'] = sh;
  }
  g.rotation.y = faceDir;
  scene.add(g);
  return { g, neck, jawPivot, arms, eyes, baseY: g.position.y };
}

const A = makeChar(0xe0393e, -1.15, 0.38);   // red left, angled toward B+camera
const B = makeChar(0x2f6fed, 1.15, -0.38);   // blue right

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
setCam('front');

// ---- L1 animation: jaw flap + head bob + hand gestures (+blink) ----
function flap(t, seed){ // speech-like jaw envelope: sum of sines ~4-7Hz
  return Math.max(0, 0.55*Math.abs(Math.sin(2*Math.PI*4.3*t + seed))
    + 0.30*Math.abs(Math.sin(2*Math.PI*6.7*t + seed*1.7))
    + 0.15*Math.abs(Math.sin(2*Math.PI*2.1*t + seed*0.6)));
}
function animate(t){
  const aTalking = t < DUR/2, bTalking = !aTalking;
  for (const [ch, talking, seed] of [[A, aTalking, 0.0], [B, bTalking, 2.4]]){
    // jaw
    ch.jawPivot.rotation.x = talking ? 0.08 + flap(t, seed)*0.55 : 0.03;
    // head bob: speaker bobs w/ speech, listener slow nod + slight tilt
    if (talking){
      ch.neck.rotation.x = 0.06 + 0.09*Math.sin(2*Math.PI*2.2*t + seed);
      ch.neck.rotation.y = 0.05*Math.sin(2*Math.PI*0.9*t + seed);
    } else {
      ch.neck.rotation.x = 0.02 + 0.035*Math.sin(2*Math.PI*0.8*t + seed); // listening nod
      ch.neck.rotation.y = 0.03*Math.sin(2*Math.PI*0.5*t);
    }
    // hands: speaker gestures with right arm, left accents; listener arms rest
    const R = ch.arms.R, L = ch.arms.L;
    if (talking){
      R.rotation.x = -1.35 + 0.45*Math.sin(2*Math.PI*1.6*t + seed);      // raised forward, waving
      R.rotation.z = -0.55 + 0.30*Math.sin(2*Math.PI*2.3*t + seed*2.0);
      L.rotation.x = -0.35 + 0.30*Math.sin(2*Math.PI*1.1*t + seed + 1.0); // accent
      L.rotation.z = 0.25;
    } else {
      R.rotation.x = -0.08 + 0.05*Math.sin(2*Math.PI*0.7*t + seed);
      R.rotation.z = -0.18; L.rotation.x = -0.08; L.rotation.z = 0.18;
    }
    // body sway + blink (both)
    ch.g.position.y = ch.baseY + (talking ? 0.03*Math.abs(Math.sin(2*Math.PI*2.2*t + seed)) : 0.012*Math.sin(2*Math.PI*0.6*t));
    const bl = (t + seed) % 2.7;
    const eyeS = bl < 0.09 ? 0.12 : 1.0;
    ch.eyes.forEach(e => e.scale.y = eyeS);
  }
  // HUD
  document.getElementById('speakerA').classList.toggle('live', aTalking);
  document.getElementById('speakerB').classList.toggle('live', bTalking);
  const f = Math.min(143, Math.floor(t*FPS));
  document.getElementById('frame').textContent = 'f' + String(f+1).padStart(3,'0') + ' / 144';
  if (document.activeElement !== scrub) scrub.value = f;
}

// ---- transport: loop 6s, scrub, ?t= for proof shots ----
const scrub = document.getElementById('scrub');
const playBtn = document.getElementById('play');
let playing = true, tCur = 0, last = performance.now();
const q = new URLSearchParams(location.search);
if (q.has('t')){ tCur = parseFloat(q.get('t')) || 0; playing = q.get('play') !== '0' && false; }
if (q.has('frame')){ tCur = (parseInt(q.get('frame'))-1) / FPS; playing = false; }
playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '⏸ pause' : '▶ play'; playBtn.classList.toggle('on', playing); };
playBtn.classList.toggle('on', playing);
if (!playing) playBtn.textContent = '▶ play';
scrub.oninput = () => { tCur = scrub.value / FPS; animate(tCur); };
document.getElementById('cam').onclick = (e) => {
  const order = ['front','side','top']; setCam(order[(order.indexOf(camName)+1)%order.length]); };
addEventListener('keydown', (e) => {
  if (e.key === ' '){ e.preventDefault(); playBtn.onclick(); }
  if (e.key === 'c' || e.key === 'C') document.getElementById('cam').onclick(); });

function loop(now){
  requestAnimationFrame(loop);
  if (playing){ tCur = (tCur + (now-last)/1000) % DUR; animate(tCur); }
  last = now; controls.update(); renderer.render(scene, camera);
  window.__tris = renderer.info.render.triangles;
}
animate(tCur); requestAnimationFrame(loop);
window.__setTime = (t) => { tCur = t % DUR; animate(tCur); renderer.render(scene, camera); };
</script>
</body>
</html>
