<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>e059 crypto multiples (TradFi-grade, read-only)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:2em auto;padding:0 1em 84px}
.twrap{max-height:60vh;overflow:auto;border:1px solid #ccc;border-radius:6px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px 8px;font-size:13px;text-align:right}
thead th{position:sticky;top:0;background:#f4f4f4;z-index:1}
td:nth-child(1),th:nth-child(1),td:nth-child(2),th:nth-child(2){text-align:left}
tr.med td{font-weight:bold;background:#f0f6ff}
.badge{background:#dfd;padding:2px 8px;border-radius:8px}.stale{background:#fdd}
.cav{font-size:12px;color:#555}button{margin:2px;padding:3px 10px;cursor:pointer}
button.on{background:#0366d6;color:#fff;border-color:#0366d6}
.up{color:#0a0}.dn{color:#c00}
.cheap{color:#0a0;font-weight:bold}.pricey{color:#c00}
.thin{background:#ffe9c4;padding:0 6px;border-radius:8px;font-size:11px;white-space:nowrap}
.spark{font-size:15px;letter-spacing:1px;white-space:nowrap}
body.simple .c-name,body.simple .c-cat,body.simple .c-mcap,body.simple .c-7d,body.simple .c-mom,body.simple .c-rev,body.simple .c-thru,body.simple .c-vol,body.simple .c-chg{display:none}
#thumbbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--tb,#fff);border-top:1px solid #ccc;padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
#thumbbar button{flex:0 0 auto;padding:10px 16px;font-size:15px;border-radius:10px}
html.dark #thumbbar{background:#161a20;border-color:#444}
details.cav{margin-top:.8em}details.cav summary{cursor:pointer;font-size:13px}
html.dark body{background:#111418;color:#e6e6e6}html.dark thead th{background:#1c2128}
html.dark td,html.dark th{border-color:#444}html.dark tr.med td{background:#16283f}
html.dark a{color:#8ab4ff}html.dark .cav{color:#aaa}html.dark .twrap{border-color:#444}
</style></head>
<body class="simple">
<h1>e059 valuation multiples <span class="badge" id="fresh">…</span> <small id="ver" style="font-weight:normal"></small></h1>
<script>if(localStorage.e59==='d')document.documentElement.classList.add('dark')</script>
<details class="cav"><summary>Coins priced against their sales — tap for sources.</summary>Top crypto protocols — P/Fees + P/Revenue (30d annualised, DefiLlama free + CoinGecko public).
No trading, no wallet, read-only. <a href="/multiples.json">JSON</a> <a href="/multiples.csv">CSV</a></details>
<div id="verdict" class="cav" style="font-size:14px;margin:.4em 0">…</div>
<div id="pulse" class="cav">…</div>
<div id="score" class="cav" style="font-size:14px;margin:.4em 0">…</div>
<div id="alerts" class="cav" style="font-size:13px;margin:.4em 0">…</div>
<details id="meta" class="cav"><summary id="metasum">…</summary><div id="metadetail"></div></details>
<div id="cats" style="margin:.6em 0"></div>
<div class="twrap"><table id="t"></table></div>
<div id="cavs" class="cav"></div>
<div id="thumbbar"></div>
<script>
let D=null, filter='ALL', cheapFirst=false;
function setFilter(c){filter=c;render()}
function mom(p){
  if(p.fees_momentum==null)return '—';
  const cls=p.fees_momentum>=1?'up':'dn';
  return `<span class="${cls}">${p.fees_momentum.toFixed(2)}×</span>`;
}
function fmtVol(v){
  if(v==null)return '—';
  if(v>=1e9)return (v/1e9).toFixed(1)+'B';
  if(v>=1e6)return Math.round(v/1e6)+'M';
  return Math.round(v/1e3)+'k';
}
function chg(p){
  if(p.price_change_24h_pct==null)return '—';
  const cls=p.price_change_24h_pct>=0?'up':'dn';
  const sign=p.price_change_24h_pct>=0?'+':'';
  return `<span class="${cls}">${sign}${p.price_change_24h_pct.toFixed(1)}%</span>`;
}
function vscat(p){
  const m=D.category_medians[p.category];
  if(p.p_fees==null||!m||!m.median_p_fees)return '—';
  const r=p.p_fees/m.median_p_fees;
  const cls=r<=0.8?'cheap':(r>=1.5?'pricey':'');
  const tag=r<=0.8?' cheap':(r>=1.5?' pricey':'');
  const thin=(m.n!=null&&m.n<20)?' <span class="thin">thin n='+m.n+'</span>':'';
  return `<span class="${cls}">${r.toFixed(1)}×${tag}</span>${thin}`;
}
function ratio(p){
  const m=D.category_medians[p.category];
  if(p.p_fees==null||!m||!m.median_p_fees)return 1e18;
  return p.p_fees/m.median_p_fees;
}
function trend(p){
  if(!p.trend_spark)return '—';
  const arrow=p.trend_dir===-1?'<span class="cheap">↓</span>':(p.trend_dir===1?'<span class="pricey">↑</span>':'<span>→</span>');
  const tip=(p.p_fees_trend||[]).join(' → ');
  return `<span class="spark" title="weekly P/Fees, oldest→newest: ${tip}">${p.trend_spark}</span> ${arrow}`;
}
function render(){
  const list=[...D.protocols].filter(p=>filter==='ALL'||p.category===filter)
    .sort((a,b)=>cheapFirst?(ratio(a)-ratio(b)):((a.p_fees||1e18)-(b.p_fees||1e18)));
  let h='<thead><tr><th>token</th><th class="c-name">name</th><th class="c-cat">cat</th><th class="c-mcap">mcap $B</th><th class="c-pf">P/Fees 30d</th><th class="c-vs">vs cat</th><th class="c-tr">sales 6wk</th><th class="c-vol">vol 24h</th><th class="c-chg">24h %</th><th class="c-7d">P/Fees 7d</th><th class="c-mom">momentum 7d/30d</th><th class="c-rev">P/Revenue</th><th class="c-thru">through</th></tr></thead><tbody>';
  const med=filter!=='ALL'?D.category_medians[filter]:null;
  if(med){const thin=(med.n!=null&&med.n<20)?' <span class="thin">thin</span>':'';h+=`<tr class="med"><td>◊</td><td class="c-name">${filter} median (n=${med.n})${thin}</td><td class="c-cat"></td><td class="c-mcap"></td><td class="c-pf">${med.median_p_fees??'—'}</td><td class="c-vs">1.0×</td><td class="c-tr"></td><td class="c-vol"></td><td class="c-chg"></td><td class="c-7d"></td><td class="c-mom">${med.median_momentum??'—'}×</td><td class="c-rev">${med.median_p_revenue??'—'}</td><td class="c-thru"></td></tr>`;
  for(const p of list){h+=`<tr><td>${p.symbol}</td><td class="c-name">${p.name}</td><td class="c-cat">${p.category||''}</td><td class="c-mcap">${p.market_cap_usd==null?'—':(p.market_cap_usd/1e9).toFixed(1)}</td><td class="c-pf">${p.p_fees??'—'}</td><td class="c-vs">${vscat(p)}</td><td class="c-tr">${trend(p)}</td><td class="c-vol">${fmtVol(p.volume_24h_usd)}</td><td class="c-chg">${chg(p)}</td><td class="c-7d">${p.p_fees_7d??'—'}</td><td class="c-mom">${mom(p)}</td><td class="c-rev">${p.p_revenue??'—'}</td><td class="c-thru">${p.data_through}</td></tr>`}
  document.getElementById('t').innerHTML=h+'</tbody>';
  document.querySelectorAll('#cats button[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===filter));
  document.querySelectorAll('#thumbbar button[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===filter));
  document.getElementById('cheapbtn').classList.toggle('on',cheapFirst);
  document.getElementById('simplebtn').classList.toggle('on',document.body.classList.contains('simple'));
  document.getElementById('fullbtn').classList.toggle('on',!document.body.classList.contains('simple'));
}
function locTs(s){try{s=String(s||'').trim();if(!s)return '\u2014';const d=new Date(s.replace(' ','T')+(/Z|[+-]\d{2}:?\d{2}$/.test(s)?'':'Z'));if(isNaN(d))return String(s);const p=n=>(n<10?'0':'')+n;return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return String(s);}}
function cheapList(){return [...D.protocols].filter(p=>ratio(p)<1e17).sort((a,b)=>ratio(a)-ratio(b))}
function trendWords(p){return p.trend_dir===-1?'getting cheaper':(p.trend_dir===1?'getting pricier':'steady')}
function pulse(d){
  const thru=d.protocols.length?d.protocols[0].data_through:'?';
  return `Sampling ${d.protocols.length} coins daily from 2 free feeds (data through ${thru}).`;
}
function gradeDue(cc){
  const p=((cc&&cc.pending)||[]).map(x=>x.date).filter(Boolean).sort();
  if(!p.length)return '';
  const d=new Date(p[0]+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+((cc&&cc.resolve_days)||30));
  return `, first grades ${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function scoreTxt(cc){
  const bt=(cc&&cc.backtest)||{}, pp=(cc&&cc.paper)||{};
  if(bt.precision!=null)return `Cheap-vs-group calls stayed cheap ${Math.round(bt.precision*100)}% (${bt.hits}/${bt.n} backtested)`+(pp.n_pending?`, ${pp.n_pending} open now${gradeDue(cc)}.`:'.');
  return 'Cheap-call scorecard building — first grade after the next refresh.';
}
function verdict(){
  const l=cheapList();
  if(!l.length)return D.protocols.length+' coins priced vs sales — tap below for what the columns mean.';
  const p=l[0];
  return `Cheapest vs its group: ${p.symbol} at ${(ratio(p)).toFixed(1)}× ${p.category} median, ${trendWords(p)}.`;
}
function alertsHtml(){
  const l=cheapList().filter(p=>ratio(p)<=0.8).slice(0,5);
  if(l.length<5)return `<b>cheap-vs-peers alerts:</b> only ${l.length}/5 qualifiers ≤0.8× (thin coverage — widening next).`;
  const deep=l.some(p=>ratio(p)<=0.5);
  const rows=l.map((p,i)=>{
    const m=D.category_medians[p.category];
    const thin=(m&&m.n<20)?` <span class="thin">thin n=${m.n}</span>`:'';
    const star=ratio(p)<=0.5?'★ ':'';
    return `${i+1}. ${star}<b>${p.symbol}</b> — P/Fees ${p.p_fees??'—'}, ${(ratio(p)).toFixed(1)}× ${p.category} median, ${trendWords(p)}, thru ${p.data_through||'?'}`+thin;
  });
  return `<b>cheap-vs-peers alerts (≤0.8× group${deep?', ★≤0.5× deep':''}):</b><br>`+rows.join('<br>');
}
function slip(){
  const l=cheapList().slice(0,3);
  const lines=l.map((p,i)=>`${i+1}. ${p.symbol} — ${(ratio(p)).toFixed(1)}× ${p.category} median, P/Fees ${p.p_fees??'—'}, ${trendWords(p)}`);
  return `e059 cheapest vs group (${locTs(D.as_of)}):\n`+lines.join('\n')+'\nestimates only, read-only, no trading';
}
function copySlip(btn){
  const t=slip();
  const done=()=>{btn.textContent='✓ copied';setTimeout(()=>btn.textContent='📋 copy top 3',1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fallback()});}
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta);}
}
fetch('/version.json').then(r=>r.json()).then(v=>{document.getElementById('ver').textContent='v'+v.commit;}).catch(()=>{});
fetch('/multiples.json').then(r=>r.json()).then(d=>{
  D=d;
  const ageH=(Date.now()/1000-new Date(d.as_of).getTime()/1000)/3600;
  const stale=ageH>49;
  document.getElementById('fresh').textContent=(stale?'STALE ':'LIVE ')+locTs(d.as_of);
  if(stale)document.getElementById('fresh').classList.add('stale');
  document.getElementById('verdict').textContent=verdict();
  document.getElementById('pulse').textContent=pulse(d);
  document.getElementById('alerts').innerHTML=alertsHtml();
  fetch('/cheap_calls.json').then(r=>r.json()).then(cc=>{document.getElementById('score').textContent=scoreTxt(cc);}).catch(()=>{});
  document.getElementById('metasum').textContent=
    d.protocols.length+' coins priced vs sales — tap for what the columns mean.';
  document.getElementById('metadetail').textContent=
    'vs cat = coin price vs its category median (<1× = cheaper) · sales 6wk = price-vs-sales each week, ↓ = getting cheaper · vol = 24h coin volume, 24h% = price move (full view) · sources: '+d.sources.join('; ');
  const cats=['ALL',...(d.categories||[...new Set(d.protocols.map(p=>p.category))])];
  const btns=cats.map(c=>`<button data-c="${c}">${c}</button>`).join(' ');
  document.getElementById('cats').innerHTML=btns;
  document.getElementById('thumbbar').innerHTML=btns+` <button id="cheapbtn">💰 cheap first</button> <button id="copybtn">📋 copy top 3</button> <button id="simplebtn">📱 simple</button><button id="fullbtn">📊 full</button> <button id="darkbtn">🌙 dark</button>`;
  document.querySelectorAll('#cats button').forEach(b=>b.onclick=()=>setFilter(b.dataset.c));
  document.querySelectorAll('#thumbbar button[data-c]').forEach(b=>b.onclick=()=>setFilter(b.dataset.c));
  document.getElementById('cheapbtn').onclick=()=>{cheapFirst=!cheapFirst;render()};
  document.getElementById('copybtn').onclick=e=>copySlip(e.target);
  const darkLbl=()=>{document.getElementById('darkbtn').textContent=document.documentElement.classList.contains('dark')?'☀️ light':'🌙 dark'};
  darkLbl();
  document.getElementById('darkbtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.e59=document.documentElement.classList.contains('dark')?'d':'l';darkLbl()};
  if(localStorage.e59view==='full')document.body.classList.remove('simple');
  document.getElementById('simplebtn').onclick=()=>{document.body.classList.add('simple');localStorage.e59view='simple';render()};
  document.getElementById('fullbtn').onclick=()=>{document.body.classList.remove('simple');localStorage.e59view='full';render()};
  render();
  document.getElementById('cavs').innerHTML='<details><summary>These numbers are estimates — tap for the fine print.</summary><ul>'+d.caveats.map(c=>'<li>'+c+'</li>').join('')+'</ul></details>';
});
</script></body></html>
