<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>e059 crypto multiples (TradFi-grade, read-only)</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:2em auto;padding:0 1em 84px}
.twrap{max-height:60vh;overflow:auto;border:1px solid #ccc;border-radius:6px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px 8px;font-size:13px;text-align:right}
thead th{position:sticky;top:0;background:#f4f4f4;z-index:1}
td:nth-child(1),th:nth-child(1),td:nth-child(2),th:nth-child(2){text-align:left}
tr.med td{font-weight:bold;background:#f0f6ff}
.badge{background:#dfd;color:#060;padding:2px 8px;border-radius:8px;white-space:nowrap}.stale{background:#fdd;color:#600}
.cav{font-size:12px;color:#555}button{margin:2px;padding:3px 10px;cursor:pointer}
button.on{background:#0366d6;color:#fff;border-color:#0366d6}
.up{color:#0a0}.dn{color:#c00}
.cheap{color:#0a0;font-weight:bold}.pricey{color:#c00}
.thin{background:#ffe9c4;color:#5a3c00;padding:0 6px;border-radius:8px;font-size:11px;white-space:nowrap}
html.dark .thin{background:#5a3c00;color:#ffe9c4}
.spark{font-size:15px;letter-spacing:1px;white-space:nowrap}
body.simple .c-name,body.simple .c-cat,body.simple .c-mcap,body.simple .c-7d,body.simple .c-mom,body.simple .c-rev,body.simple .c-thru,body.simple .c-vol,body.simple .c-chg{display:none}
#thumbbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--tb,#fff);border-top:1px solid #ccc;padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
#thumbbar button{flex:0 0 auto;padding:10px 16px;font-size:15px;border-radius:10px}
html.dark #thumbbar{background:#161a20;border-color:#444}
details.cav{margin-top:.8em}details.cav summary{cursor:pointer;font-size:13px}
html.dark body{background:#111418;color:#e6e6e6}html.dark thead th{background:#1c2128}
html.dark td,html.dark th{border-color:#444}html.dark tr.med td{background:#16283f}
html.dark a{color:#8ab4ff}html.dark .cav{color:#aaa}html.dark .twrap{border-color:#444}
</style>
<link rel="stylesheet" href="tablelib.css"></head>
<body class="simple">
<h1>e059 valuation multiples <span class="badge" id="fresh">…</span> <small id="ver" style="font-weight:normal"></small></h1>
<script>if(localStorage.e59==='d')document.documentElement.classList.add('dark')</script>
<details class="cav"><summary>Coins priced against their sales — tap for sources.</summary>Top crypto protocols — P/Fees + P/Revenue (30d annualised, DefiLlama free + CoinGecko public).
No trading, no wallet, read-only. <a href="/multiples.json">JSON</a> <a href="/multiples.csv">CSV</a></details>
<div id="verdict" class="cav" style="font-size:14px;margin:.4em 0">…</div>
<div id="pulse" class="cav">…</div>
<div id="score" class="cav" style="font-size:14px;margin:.4em 0">…</div>
<div id="alerts" class="cav" style="font-size:13px;margin:.4em 0">…</div>
<details id="meta" class="cav"><summary id="metasum">…</summary><div id="metadetail"></div></details>
<div id="medians" class="cav">…</div>
<div id="table-slot">…</div>
<script src="tablelib.js"></script>
<div id="cavs" class="cav"></div>
<div id="thumbbar"></div>
<script>
let D=null;
/* table rendered by tablelib; categories = auto preset chips. */
/* cells rendered by tablelib now; ratio() stays for verdict/alerts/slip. */
function ratio(p){
  const m=D.category_medians[p.category];
  if(p.p_fees==null||!m||!m.median_p_fees)return 1e18;
  return p.p_fees/m.median_p_fees;
}
function locTs(s){try{s=String(s||'').trim();if(!s)return '\u2014';const d=new Date(s.replace(' ','T')+(/Z|[+-]\d{2}:?\d{2}$/.test(s)?'':'Z'));if(isNaN(d))return String(s);const p=n=>(n<10?'0':'')+n;return p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return String(s);}}
function cheapList(){return [...D.protocols].filter(p=>ratio(p)<1e17).sort((a,b)=>ratio(a)-ratio(b))}
function trendWords(p){return p.trend_dir===-1?'getting cheaper':(p.trend_dir===1?'getting pricier':'steady')}
function modeThru(d){const c={};for(const p of d.protocols){if(p.data_through)c[p.data_through]=(c[p.data_through]||0)+1}let m='?',n=-1;for(const k in c){if(c[k]>n){n=c[k];m=k}}return m}
function pulse(d){
  const mode=modeThru(d);
  const lag=d.protocols.filter(p=>p.data_through!==mode).length;
  const thruTxt=lag?`${d.protocols.length-lag} current thru ${mode}, ${lag} lagging \u2014 marked stale`:`data through ${mode}`;
  return `Sampling ${d.protocols.length} coins daily from 2 free feeds (${thruTxt}).`;
}
function verdict(){
  const l=cheapList();
  if(!l.length)return D.protocols.length+' coins priced vs sales — tap below for what the columns mean.';
  const p=l[0];
  const stale=p.data_through!==modeThru(D)?' (stale data)':'';
  return `Cheapest vs its group: ${p.symbol} at ${(ratio(p)).toFixed(1)}× ${p.category} median, ${trendWords(p)}${stale}.`;
}
function slip(){
  const l=cheapList().slice(0,3);
  const lines=l.map((p,i)=>`${i+1}. ${p.symbol} — ${(ratio(p)).toFixed(1)}× ${p.category} median, P/Fees ${p.p_fees??'—'}, ${trendWords(p)}`);
  return `e059 cheapest vs group (${locTs(D.as_of)}):\n`+lines.join('\n')+'\nestimates only, read-only, no trading';
}
function copySlip(btn){
  const t=slip();
  const done=()=>{btn.textContent='✓ copied';setTimeout(()=>btn.textContent='📋 copy top 3',1500)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>{fallback()});}
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta);}
}
fetch('/version.json').then(r=>r.json()).then(v=>{document.getElementById('ver').textContent='v'+v.commit;}).catch(()=>{});
fetch('/multiples.json').then(r=>r.json()).then(d=>{
  D=d;
  const ageH=(Date.now()/1000-new Date(d.as_of).getTime()/1000)/3600;
  const stale=ageH>49;
  document.getElementById('fresh').textContent=(stale?'STALE ':'LIVE ')+locTs(d.as_of);
  if(stale)document.getElementById('fresh').classList.add('stale');
  document.getElementById('verdict').textContent=verdict();
  document.getElementById('pulse').textContent=pulse(d);

  document.getElementById('metasum').textContent=
    d.protocols.length+' coins priced vs sales — tap for what the columns mean.';
  document.getElementById('thumbbar').innerHTML=` <button id="copybtn">copy top 3</button> <button id="darkbtn">dark</button>`;
  document.getElementById('copybtn').onclick=e=>copySlip(e.target);
  const darkLbl=()=>{document.getElementById('darkbtn').textContent=document.documentElement.classList.contains('dark')?'☀️ light':'🌙 dark'};
  darkLbl();
  document.getElementById('darkbtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.e59=document.documentElement.classList.contains('dark')?'d':'l';darkLbl()};
  try{if(localStorage.e59view==='full'&&!localStorage['tl-density'])localStorage['tl-density']='full';}catch(e){}
  if(window.tlRender)tlRender('e59');
  document.getElementById('cavs').innerHTML='<details><summary>These numbers are estimates — tap for the fine print.</summary><ul>'+d.caveats.map(c=>'<li>'+c+'</li>').join('')+'</ul></details>';
});
</script></body></html>
