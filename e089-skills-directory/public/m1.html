<!-- m1 · driving skill: responsive-design (wshobson/agents) · installs 20.0K, repo stars 40.3K shared across whole repo (not skill-specific) · skills.sh: https://www.skills.sh/wshobson/agents/responsive-design · evidence: evidence-mobile/03-skills-sh-wshobson-responsive-design.md · doctrine applied: container queries, fluid clamp() typography, mobile-first, content-based breakpoints, responsive tables · no substitution: exact skill used -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indexer Directory · m1 (container queries)</title>
<style>
*{box-sizing:border-box}
:root{--ink:#101418;--mut:#5c6670;--acc:#0b5fff;--line:#e2e6ec;--bg:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:72rem;margin:0 auto;padding:0 1rem}
header{padding:clamp(1.5rem,4vw,3rem) 0 .75rem}
h1{font-size:clamp(1.6rem,1.1rem + 3vw,2.6rem);line-height:1.1;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:clamp(.9rem,.85rem + .5vw,1.05rem);max-width:40em}
.controls{display:flex;flex-wrap:wrap;gap:.6rem;padding:.8rem 0;border-block:2px solid var(--ink)}
.controls input,.controls select{font-size:1rem;padding:.55rem .7rem;border:1px solid var(--mut);border-radius:.5rem;min-width:min(14rem,100%)}
.board{container-type:inline-size}
.grid{display:grid;gap:.8rem;padding:1rem 0 5rem;grid-template-columns:1fr}
@container (min-width:34rem){.grid{grid-template-columns:1fr 1fr}}
@container (min-width:58rem){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{border:1px solid var(--line);border-radius:.8rem;padding:.9rem;display:flex;flex-direction:column;gap:.4rem}
.card h2{margin:0;font-size:clamp(1.05rem,1rem + .6vw,1.25rem)}
.badges{display:flex;flex-wrap:wrap;gap:.35rem}
.b{font-size:.75rem;border:1px solid var(--line);border-radius:2rem;padding:.1rem .6rem;color:var(--mut)}
.b.hot{color:var(--acc);border-color:var(--acc)}
.meta{font-size:.85rem;color:var(--mut)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
button,a.btn{font-size:.95rem;padding:.6rem .9rem;border-radius:.5rem;border:1px solid var(--ink);background:#fff;cursor:pointer;min-height:44px}
button.go{background:var(--ink);color:#fff}
a.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);white-space:nowrap}
@supports not (container-type:inline-size){.grid{grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Blockchain data indexers</h1>
<p class="sub">m1 · built with <b>wshobson/agents responsive-design</b> (20.0K installs): container queries, fluid type, mobile-first. Same data as m2–m5. <a href="/mobile">Compare versions</a></p>
<div class="controls">
<input id="q" type="search" placeholder="Search name, chain, interface" aria-label="Search">
<select id="t" aria-label="Type"><option value="">All types</option><option value="app-subgraph">app-subgraph</option><option value="indexer-framework">indexer-framework</option><option value="unified-data-api">unified-data-api</option><option value="rpc-stream">rpc-stream</option><option value="sql-warehouse">sql-warehouse</option></select>
<select id="s" aria-label="Sort"><option value="name">Sort: name</option><option value="chains">Sort: chains ↓</option><option value="latency">Sort: fastest first</option></select>
</div>
<p class="meta" id="census"></p>
</header>
<div class="board"><div class="grid" id="grid"></div>
<div class="tblwrap"><table id="tbl" aria-label="Full comparison table"></table></div>
</div>
</div>
<script>
const D=[["The Graph","app-subgraph",60,"GraphQL","indexed","per-query",1,"100k/mo free"],["GoldRush by Covalent","unified-data-api",100,"REST+stream","near-real-time","subscription",1,"14-day/25k credits"],["Moralis","unified-data-api",0,"REST+webhook","near-real-time","subscription",1,"free tier (verify tiers)"],["Alchemy","rpc-stream",100,"RPC+REST+webhooks","near-real-time","compute-units",1,"30M CU/mo free"],["QuickNode Streams","rpc-stream",0,"RPC+streams","streaming","subscription",0,"verify tiers"],["Helius","rpc-stream",1,"RPC+WSS/gRPC","streaming","subscription",1,"1M credits free"],["Bitquery","sql-warehouse",9,"GraphQL+WS+SQL","streaming","subscription",1,"7-day trial"],["Dune","sql-warehouse",0,"SQL+API","warehouse","credits",1,"2,500 credits/mo"],["Flipside","sql-warehouse",30,"SQL+API","warehouse","seats",0,"verify"],["Subsquid (SQD)","indexer-framework",200,"GraphQL","indexed","self-host $0",1,"portal free"],["Envio HyperIndex","indexer-framework",0,"GraphQL","indexed","self-host $0",1,"cloud free dev"],["Ponder","indexer-framework",0,"GraphQL/SQL","indexed","self-host $0",1,"$0 your infra"],["Apibara","indexer-framework",0,"gRPC stream","streaming","self-host $0",1,"$0 self-host"],["Checkpoint","indexer-framework",2,"GraphQL","indexed","self-host $0",1,"$0 library"],["Chainbase","unified-data-api",0,"REST+GraphQL","near-real-time","subscription",0,"verify"]];
const LAT={streaming:0,"near-real-time":1,indexed:2,warehouse:3};
const grid=document.getElementById('grid'),tbl=document.getElementById('tbl');
function rows(){const q=document.getElementById('q').value.toLowerCase(),t=document.getElementById('t').value,s=document.getElementById('s').value;
let L=D.filter(r=>!t||r[1]===t).filter(r=>(r[0]+r[1]+r[3]).toLowerCase().includes(q));
L.sort((a,b)=>s==='chains'?b[2]-a[2]:s==='latency'?LAT[a[4]]-LAT[b[4]]:a[0].localeCompare(b[0]));return L;}
function render(){const L=rows();
document.getElementById('census').textContent=L.length+' of '+D.length+' indexers · fluid container-query grid · columns: name, type, chains, interface, latency, pricing, free tier';
grid.innerHTML=L.map(r=>'<article class="card"><h2>'+r[0]+'</h2><div class="badges"><span class="b hot">'+r[1]+'</span><span class="b">'+r[4]+'</span><span class="b">'+(r[2]||'—')+' chains</span></div><p class="meta">'+r[3]+' · '+r[5]+' · '+(r[6]?'free: '+r[7]:'no free tier')+'</p><div class="row"><button class="go" data-c="'+r[0]+'">Copy</button><a class="btn" href="/api/indexers" target="_blank" rel="noopener">Source</a></div></article>').join('');
tbl.innerHTML='<tr><th>Name</th><th>Type</th><th>Chains</th><th>Interface</th><th>Latency</th><th>Pricing</th><th>Free</th></tr>'+L.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+(r[2]||'verify')+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'</td><td>'+r[7]+'</td></tr>').join('');
grid.querySelectorAll('button').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.c);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);});}
document.getElementById('q').oninput=render;document.getElementById('t').onchange=render;document.getElementById('s').onchange=render;render();
</script>
<nav class="mxbar"><span>m1 wshobson</span><a href="/mobile">compare</a><a href="/m2">m2</a><a href="/m3">m3</a><a href="/m4">m4</a><a href="/m5">m5</a></nav>
<style>.mxbar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:.4rem;align-items:center;padding:.6rem .8rem calc(.6rem + env(safe-area-inset-bottom));background:#101418;color:#9aa0a6;font:14px system-ui}.mxbar a{color:#cfd4da;text-decoration:none;border:1px solid #3a3f44;border-radius:2rem;padding:.45rem .9rem;min-height:44px;display:inline-flex;align-items:center}body{padding-bottom:76px}</style>
</body>
</html>
