<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>URL Video Queue</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
    padding: 16px; max-width: 640px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type=url] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d;
    background: #161b22; color: #e6edf3; font-size: 16px;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: 1px solid #238636;
    background: #238636; color: #fff; font-size: 16px; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  .job {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .url { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .status { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .s-done { background: #1f6feb33; color: #58a6ff; }
  .s-error { background: #f8514922; color: #f85149; }
  .s-cancelled, .s-cancelling { background: #d2992222; color: #d29922; }
  .s-waiting_window { background: #6e768122; color: #8b949e; }
  .s-queued { background: #6e768122; color: #c9d1d9; }
  .s-detecting, .s-downloading, .s-merging { background: #23863622; color: #3fb950; }
  .bar { height: 6px; background: #30363d; border-radius: 4px; margin: 10px 0 6px; overflow: hidden; }
  .bar > div { height: 100%; background: #3fb950; width: 0; transition: width .4s; }
  .meta { font-size: 11px; color: #8b949e; }
  .items { margin-top: 8px; display: grid; gap: 4px; }
  .item { font-size: 12px; color: #8b949e; display: flex; gap: 6px; align-items: center; }
  .item .n { color: #3fb950; font-weight: 600; }
  .error { font-size: 12px; color: #f85149; margin-top: 6px; word-break: break-word; }
  a.dl { font-size: 12px; color: #58a6ff; text-decoration: none; }
  .actions { display: flex; gap: 6px; align-items: center; }
  .cancel { font-size: 11px; color: #d29922; background: none; border: 1px solid #d2992266;
    border-radius: 6px; cursor: pointer; padding: 3px 8px; }
  .empty { text-align: center; color: #8b949e; padding: 40px 0; font-size: 14px; }
  footer { font-size: 11px; color: #484f58; text-align: center; margin-top: 30px; }
</style>
</head>
<body>
<h1>URL Video Queue</h1>
<form id="f">
  <input type="url" id="u" placeholder="https://... (page with videos)" required>
  <button>Add</button>
</form>
<div id="list"></div>
<footer>detect → download → merge</footer>
<script>
const $ = (s) => document.querySelector(s);
const FINAL = ["done","error","cancelled"];
const esc = (s) => String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const itstatus = (it) => ({downloading:"downloading", done:"✓", error:"✗"}[it.status] || it.status);
const cards = {};

function makeCard(job) {
  const el = document.createElement("div");
  el.className = "job";
  el.innerHTML = `
    <div class="row"><div class="url" title="${esc(job.url)}">${esc(job.url)}</div>
      <div class="actions"><span class="status"></span><span class="dlwrap"></span></div></div>
    <div class="bar" style="display:none"><div></div></div>
    <div class="items"></div>
    <div class="error" style="display:none"></div>`;
  $("#list").appendChild(el);
  const card = {
    el, status: el.querySelector(".status"), dlwrap: el.querySelector(".dlwrap"),
    bar: el.querySelector(".bar"), barfill: el.querySelector(".bar div"),
    items: el.querySelector(".items"), error: el.querySelector(".error"),
    playerDone: false, key: "",
  };
  updateCard(card, job);
  return card;
}

function updateCard(card, job) {
  card.status.textContent = job.status;
  card.status.className = "status s-" + job.status;
  const active = ["detecting","downloading","merging"].includes(job.status);
  card.bar.style.display = active ? "" : "none";
  if (active) card.barfill.style.width = ((job.progress||{}).percent || 0) + "%";
  const key = JSON.stringify(job.items || []);
  if (key !== card.key) {
    card.key = key;
    card.items.innerHTML = (job.items || []).map(it =>
      `<div class="item"><span class="n">${it.index+1}</span><span>${itstatus(it)} ${it.pct != null && it.status==="downloading" ? Math.round((it.pct||0)*100)+"%" : ""}</span>${it.error?` <span style="color:#f85149">${esc(it.error)}</span>`:""}</div>`
    ).join("");
  }
  const actions = job.status === "done"
    ? `<a class="dl" href="api/jobs/${job.id}/video">⬇ merged.mp4</a>`
    : FINAL.includes(job.status) ? ""
      : `<button class="cancel" onclick="cancelJob('${job.id}')">cancel</button>`;
  if (card.dlwrap.dataset.cur !== actions) {
    card.dlwrap.dataset.cur = actions;
    card.dlwrap.innerHTML = actions;
  }
  if (job.status === "done" && !card.playerDone) {
    card.playerDone = true;
    const v = document.createElement("video");
    v.controls = v.playsInline = true;
    v.preload = "metadata";
    v.style.cssText = "width:100%;border-radius:8px;margin-top:10px;background:#000";
    v.src = `api/jobs/${job.id}/video`;
    card.el.appendChild(v);
  }
  if (job.error) { card.error.textContent = job.error; card.error.style.display = ""; }
  else card.error.style.display = "none";
}

async function refresh() {
  try {
    const d = await (await fetch("api/jobs")).json();
    const ids = new Set(d.jobs.map(j => j.id));
    for (const id in cards) if (!ids.has(id)) { cards[id].el.remove(); delete cards[id]; }
    let anyActive = false;
    for (const job of d.jobs) {
      anyActive = anyActive || !FINAL.includes(job.status);
      if (cards[job.id]) updateCard(cards[job.id], job);
      else cards[job.id] = makeCard(job);
    }
    if (!d.jobs.length) $("#list").innerHTML = '<div class="empty">No jobs yet. Paste a URL above.</div>';
  } catch (e) {}
  return anyActive;
}

async function cancelJob(id) {
  await fetch("api/jobs/"+id, {method:"DELETE"});
  refresh();
}

let timer = null;
function ensurePolling() {
  if (timer) return;
  timer = setInterval(async () => {
    const active = await refresh();
    if (!active) { clearInterval(timer); timer = null; }
  }, 3000);
}

$("#f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = $("#u").value;
  if (!u) return;
  await fetch("api/jobs", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({url:u})});
  $("#u").value = "";
  await refresh();
  ensurePolling();
});

refresh().then(active => { if (active) ensurePolling(); });
</script>
</body>
</html>
