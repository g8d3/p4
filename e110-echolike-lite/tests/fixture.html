<!doctype html>
<html><body>
<article data-testid="tweet">
  <div data-testid="User-Name"><span>NASA</span><span>@nasa</span></div>
  <div data-testid="tweetText" lang="en">The real post text.</div>
  <div role="group">
    <button data-testid="reply" aria-label="1.234 respuestas">1,2 mil</button>
    <button data-testid="retweet" aria-label="56 reposts">56</button>
    <button data-testid="like" aria-label="12 likes">12</button>
    <button data-testid="bookmark" aria-label="3 bookmarks">3</button>
  </div>
  <a href="/nasa/status/111/analytics" aria-label="98.765 visualizaciones">98.765</a>
  <a href="/nasa/status/111"><time datetime="2026-11-10T10:00:00Z">10:00</time></a>
  <div role="link" tabindex="0">
    <div data-testid="tweetText">Quoted tweet text that must be ignored.</div>
    <a href="/someoneelse/status/999"><time datetime="2026-11-09T09:00:00Z">09:00</time></a>
  </div>
</article>

<!-- A promoted post exactly as X renders it: the article sits inside the ad wrapper. -->
<div data-testid="cellInnerDiv" id="adcell">
  <div data-testid="placementTracking">
    <article data-testid="tweet" id="adarticle">
      <div data-testid="tweetText">Buy this thing you do not need.</div>
      <div role="group"><button data-testid="like">1</button></div>
      <a href="/somedeal/status/333"><time datetime="2026-11-10T12:00:00Z">12:00</time></a>
    </article>
  </div>
</div>

<article data-testid="tweet">
  <div data-testid="tweetText">Second post.</div>
  <div role="group"><button data-testid="unlike">5</button><button data-testid="bookmark">x</button></div>
  <a href="/sama/status/222"><time datetime="2026-11-10T11:00:00Z">11:00</time></a>
</article>

<!-- Grok answer module: the same placement wrapper X uses for ads, no tweet.
     The ads switch must never touch it. -->
<div data-testid="cellInnerDiv" id="grokcell">
  <div data-testid="placementTracking" id="grokmodule">
    <div data-testid="GrokAnswerText">Grok's answer stays visible.</div>
    <a href="/grok">Grok</a>
  </div>
</div>

<!-- Grok answer rendered as a post inside the same wrapper: the /grok author
     link keeps it visible even though it is a tweet in a placement. -->
<div data-testid="cellInnerDiv" id="grokTweetCell">
  <div data-testid="placementTracking" id="grokTweetPlacement">
    <article data-testid="tweet" id="grokarticle">
      <div data-testid="tweetText">Grok answers in a post.</div>
      <a href="/grok/status/444"><time datetime="2026-11-10T13:00:00Z">13:00</time></a>
    </article>
  </div>
</div>

<div data-testid="sidebarColumn">
  <div data-testid="trend" id="promotedtrend">
    <svg><path d="M19.498 3h-15c-1.381 0-2.5 1.12-2.5 2.5v13c0 1.38 1.119 2.5 2.5 2.5h15c1.381 0 2.5-1.12 2.5-2.5v-13c0-1.38-1.119-2.5-2.5-2.5z"></path></svg>
    Promoted trend
  </div>
  <div data-testid="trend" id="normaltrand">
    <svg><path d="M1 2h3v3H1z"></path></svg>
    A real trend
  </div>
</div>

<script>
  // Stubs of the extension APIs the content script touches: message channel + storage.
  // One injected flag lets a test flip the ads switch the way the popup does.
  window.__sent = [];
  window.__changeListeners = [];
  let store = { hide_ads: window.__HIDE_ADS !== undefined ? window.__HIDE_ADS : true };
  window.chrome = {
    runtime: {
      // The page reads its version from the manifest, and the icon from the package:
      // both stubbed so the launcher can be tested without installing anything.
      getManifest: () => ({ version: window.__VERSION || "9.9.9" }),
      getURL: (p) => "chrome-extension://stub/" + p,
      onMessage: { addListener: (fn) => (window.__msgListeners = window.__msgListeners || []).push(fn) },
      sendMessage: (m, cb) => {
        if (m.type === "hello" || m.type === "net-online") return Promise.resolve({ ok: true });
        if (m.type === "export") {
          const pick = m.pick || "all";
          const items = (window.__mirror || []).filter((it) =>
            pick === "likes" ? it.kind === "like" || it.kind === "unlike"
            : pick === "bookmarks" ? it.kind === "bookmark" || it.kind === "unbookmark" : true);
          cb && cb({ ok: true, items, pick });
          return Promise.resolve({ ok: true, items, pick });
        }
        if (m.type === "open") {
          (window.__opened = window.__opened || []).push(m.page);
          cb && cb({ ok: true });
          return Promise.resolve({ ok: true });
        }
        window.__sent.push(m);
        cb && cb({ sent: true });
        return Promise.resolve({ sent: true });
      },
    },
    storage: {
      local: {
        set: (obj) => { window.__writes = window.__writes || []; window.__writes.push(obj); Object.assign(store, obj); return Promise.resolve(); },
        get: (defaults, cb) => {
          const out = Object.assign({}, defaults);
          for (const k of Object.keys(defaults)) if (k in store) out[k] = store[k];
          cb && cb(out);
          return Promise.resolve(out);
        },
      },
      onChanged: { addListener: (fn) => window.__changeListeners.push(fn) },
    },
  };
  window.__setStore = (v) => { Object.assign(store, v); };
  window.__emitChange = (changes) => window.__changeListeners.forEach((fn) => fn(changes));
  window.__setHideAds = (v) => {
    store.hide_ads = v;
    window.__changeListeners.forEach((fn) => fn({ hide_ads: { newValue: v } }));
  };
</script>
</body></html>
