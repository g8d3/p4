<!doctype html>
<meta charset="utf-8">
<title>EchoLike Lite</title>
<style>
body{font:14px system-ui;width:320px;margin:12px;color:#111}
#list{margin-top:10px;max-height:240px;overflow:auto}
#list div{border-top:1px solid #eee;padding:5px 0;font-size:12px}
#list b{font-weight:600}
#list a{color:#1d9bf0;text-decoration:none}
#list span{color:#555}
input{font:inherit;width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:8px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.primary{background:#111;color:#fff;border-color:#111}
button:disabled{opacity:.5;cursor:default}
#status{margin:8px 0;padding:8px;border-radius:8px;background:#f2f2f2}
.ok{color:#00875a}.err{color:#d0021b}.mut{color:#666;font-size:12px}
details{margin:6px 0}summary{cursor:pointer;color:#666;font-size:12px}
</style>
<h3 style="margin:0 0 4px">EchoLike Lite</h3>
<div id="status">…</div>
<button id="find" class="primary" type="button">Find my inbox</button><button id="retry" type="button">Retry</button>
<label class="mut" style="display:block;margin:6px 0"><input id="ads" type="checkbox" style="width:auto;margin-right:6px">Hide ads on X (promoted posts and trends)</label>
<p class="mut">Like or bookmark any post on X — it is saved in this browser and sent to your inbox when one is connected. Works without an inbox too.</p>
<details id="adv">
  <summary>Advanced: inbox on another machine or hosted</summary>
  <input id="url" type="url" autocomplete="off" spellcheck="false" placeholder="Inbox address, e.g. http://192.168.0.5:8931">
  <input id="token" type="password" autocomplete="off" placeholder="Token (only if the server handed you one)">
  <button id="save" type="button">Save &amp; send</button><button id="forget" type="button">Disconnect</button>
</details>
<div id="list"></div>
<script src="popup.js"></script>
