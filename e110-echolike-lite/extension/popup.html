<!doctype html>
<meta charset="utf-8">
<title>EchoLike Lite</title>
<style>
body{font:14px system-ui;width:300px;margin:12px;color:#111}
input{font:inherit;width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:8px}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.primary{background:#111;color:#fff;border-color:#111}
#status{margin:8px 0;padding:8px;border-radius:8px;background:#f2f2f2}
.ok{color:#00875a}.err{color:#d0021b}.mut{color:#666;font-size:12px}
</style>
<h3 style="margin:0 0 4px">EchoLike Lite</h3>
<div id="status">…</div>
<input id="url" type="url" autocomplete="off" spellcheck="false" placeholder="Inbox address, e.g. http://192.168.0.5:8911">
<input id="token" type="password" autocomplete="off" placeholder="Inbox token (printed by server.py)">
<button id="save" class="primary" type="button">Save &amp; send</button><button id="retry" type="button">Retry</button>
<p class="mut">Like or bookmark any post on X — it is saved in this browser and sent to your inbox. No inbox yet? Run <code>server.py</code> on your computer and paste its address + token above.</p>
<script src="popup.js"></script>
