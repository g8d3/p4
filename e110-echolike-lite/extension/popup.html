<!doctype html>
<meta charset="utf-8">
<title>EchoLike Lite</title>
<style>
body{font:14px system-ui;width:320px;margin:12px;color:#111}
#list{margin-top:10px;max-height:240px;overflow:auto}
#list div{border-top:1px solid #eee;padding:5px 0;font-size:12px}
#list b{font-weight:600}
#list a{color:#1d9bf0;text-decoration:none}
#list span{color:#555}
button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.primary{background:#111;color:#fff;border-color:#111}
button:disabled{opacity:.45;cursor:default}
#status{margin:8px 0;padding:8px;border-radius:8px;background:#f2f2f2}
.ok{color:#00875a}.err{color:#d0021b}.mut{color:#666;font-size:12px}
#settings{display:block;margin-top:8px;font-size:12px;color:#666;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
</style>
<h3 style="margin:0 0 4px">EchoLike Lite</h3>
<div id="status">…</div>
<button id="find" class="primary" type="button">Find my inbox</button><button id="retry" type="button">Retry</button>
<a id="open" class="mut" style="display:none;margin-left:4px" href="inbox.html" target="_blank" rel="noreferrer">Open my inbox →</a>
<label class="mut" style="display:block;margin:6px 0"><input id="ads" type="checkbox" style="width:auto;margin-right:6px">Hide ads on X (promoted posts and trends)</label>
<p class="mut">Like or bookmark any post on X — it is saved in this browser and sent encrypted to your inbox: the one on this computer if there is one, otherwise the hosted one. No setup.</p>
<button id="settings" type="button">Settings: recovery code, account, own server</button>
<div id="list"></div>
<script src="popup.js"></script>
