<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
  <video class="clip" data-start="0" data-duration="5" data-track-index="1"
         muted data-volume="0"
         src="assets/globe_clip.webm"
         style="position:absolute;top:0;left:0;width:1080px;height:1920px;object-fit:cover;opacity:0.7">
  </video>
  <div class="clip" data-start="0" data-duration="5" data-track-index="2"
       style="position:absolute;top:0;left:0;width:1080px;height:1920px;background:radial-gradient(circle at center, transparent 30%, #050510 100%)"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
window.__timelines["main"] = tl;
</script>
</body>
</html>
