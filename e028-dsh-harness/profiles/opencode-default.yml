# e028 profile overlay: default provider + model from OPENCODE_* env vars.
# Applied on every boot via `dsh web --patch ...` (see bin/start.sh).
# Top-level YAML array of loader patch entries (`!!js` allowed).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        baseURL: !!js process.env.OPENCODE_GO_BASE_URL || "https://opencode.ai/zen/go/v1/"
        models:
          - id: !!js process.env.OPENCODE_GO_MODEL || "muse-spark-1.3-contributor"
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: !!js process.env.OPENCODE_GO_MODEL || "muse-spark-1.3-contributor"
