<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookmarkVault v0.1.0 — Hub</title>
<!-- BookmarkVault v0.1.0 -->
<style>
body{font-family:system-ui;margin:0}
nav{background:#111;color:#fff;padding:6px;display:flex;gap:4px;position:fixed;bottom:0;left:0;right:0;overflow-x:auto;white-space:nowrap}
nav button{flex:1;min-width:0;background:#222;color:#fff;border:1px solid #444;border-radius:6px;padding:8px 4px;font-size:13px}
nav button.on{background:#fff;color:#111}
body{margin:0;padding-bottom:0}
iframe{width:100%;height:calc(100vh - 44px);height:calc(100dvh - 44px);border:0;display:block}
iframe.full{height:100vh;height:100dvh}
nav.hidden{display:none}
</style>
<nav id="nav"></nav>
<iframe id="v" title="view"></iframe>
<script>
const P=[
 ["Cycle","ops/cycle.html"],
 ["Home","sites/landing/index.html"],
 ["Pricing","sites/landing/pricing.html"],
 ["Terms","sites/landing/terms.html"],
 ["Dev","sites/landing/dev.html"]
];
const nav=document.getElementById('nav'),v=document.getElementById('v');
P.forEach(([t,u],i)=>{
 const b=document.createElement('button');b.textContent=t;
 b.onclick=()=>{v.src=u;[...nav.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');location.hash=i};
 nav.appendChild(b);
});
const n=parseInt((location.hash||'#0').slice(1))||0;
nav.children[n].click();
function fit(){v.style.height=(window.innerHeight-44)+'px'}
addEventListener('resize',fit);fit();
</script>
</html>
