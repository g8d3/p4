      position: absolute;

    .card-head {

  </style>

  <div id="root" data-composition-id="06-opencode" data-width="1920" data-height="1080" data-duration="7.14">
    <div class="bg clip" id="f06-opencode-bg" data-start="0" data-duration="6.089" data-track-index="1"></div>
    <div class="grain clip" id="f06-opencode-grain" data-start="0" data-duration="6.089" data-track-index="2"></div>

    <div class="step-pill" id="step">Paso 3</div>

    <div class="card" id="card">
      <div class="card-head"><span>$ opencode</span><span class="caret" id="caret"></span></div>

      <div class="stack-row">
        <span class="stack-pill" id="opencode-pill">OpenCode Go</span>
        <span class="stack-pill" id="deepseek-pill">DeepSeek Flash</span>
      </div>

      <div class="status-row" id="status-row">
        <svg class="spinner" id="spinner" viewBox="0 0 50 50" aria-hidden="true">
          <circle cx="25" cy="25" r="20" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round" stroke-dasharray="95 60" />
        </svg>
        <span id="status">Pensando…</span>
      </div>

      <div class="check-row" id="row1"><span class="check" id="check1"></span><span>Instala</span></div>
      <div class="check-row" id="row2"><span class="check" id="check2"></span><span>Conecta</span></div>
      <div class="check-row" id="row3"><span class="check" id="check3"></span><span>Trabaja</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#step",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.1,
    );
    tl.fromTo(
      "#card",
      { opacity: 0, y: 60 },
      { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
      0.3,
    );

    const blink = { p: 0 };
    tl.to(
      blink,
      {
        p: Math.PI * 2 * 6,
        duration: 5.589,
        ease: "none",
        onUpdate: () => {
          document.getElementById("caret").style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
        },
      },
      0,
    );

    tl.fromTo(
      "#opencode-pill",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      1.5,
    );
    tl.fromTo(
      "#deepseek-pill",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      2.0,
    );

    const spin = { r: 0 };
    tl.to(
      spin,
      {
        r: 720,
        duration: 2.6,
        ease: "none",
        onUpdate: () => {
          document.getElementById("spinner").style.transform = `rotate(${spin.r}deg)`;
        },
      },
      2.5,
    );

    const statuses = [
      { t: 2.5, text: "Pensando…" },
      { t: 3.2, text: "Planeando…" },
      { t: 3.9, text: "Escribiendo…" },
    ];
    const statusEl = document.getElementById("status");
    const sDriver = { t: 0 };
    tl.to(
      sDriver,
      {
        t: 5.589,
        duration: 5.589,
        ease: "none",
        onUpdate: () => {
          let cur = "Pensando…";
          for (let i = statuses.length - 1; i >= 0; i--) {
            if (sDriver.t >= statuses[i].t) {
              cur = statuses[i].text;
              break;
            }
          }
          statusEl.textContent = cur;
        },
      },
      0,
    );

    const rows = [
      { row: "#row1", check: "#check1" },
      { row: "#row2", check: "#check2" },
      { row: "#row3", check: "#check3" },
    ];
    rows.forEach((r, i) => {
      const at = 4.2 + i * 0.4;
      tl.fromTo(
        r.row,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        at,
      );
      tl.fromTo(
        r.check,
        { backgroundColor: "#fff", color: "#f5f5f0", scale: 0.6 },
        {
          backgroundColor: "#c4d94e",
          color: "#1a1a1a",
          scale: 1,
          duration: 0.35,
          ease: "power3.out",
          onStart: () => {
            document.querySelector(r.check).textContent = "✓";
          },
        },
        at + 0.15,
      );
    });

    window.__timelines["06-opencode"] = tl;
  </script>
