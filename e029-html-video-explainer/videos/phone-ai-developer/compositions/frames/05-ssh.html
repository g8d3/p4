      { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
      2.3,
    );

    const bridge = document.getElementById("bridge");
    const len = bridge.getTotalLength();
    gsap.set(bridge, { strokeDasharray: len, strokeDashoffset: len });
